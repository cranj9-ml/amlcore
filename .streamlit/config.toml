# Dashboard look: light, with the model's blue as the accent (app/dashboard.py).
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f1f0ea"
textColor = "#14213d"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"   # no Deploy button: this is a local showcase
