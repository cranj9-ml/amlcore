[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amlcore"
version = "1.0.0"
description = "AML transaction monitoring on IBM AMLworld: leak-free features, a rules baseline and LightGBM, judged at a fixed alert budget."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "lightgbm>=4.0",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The showcase dashboard (app/dashboard.py).
app = ["streamlit>=1.40", "plotly>=5.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
